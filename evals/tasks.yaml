# Task templates. Each template is one task with variation.
# generate.py expands each template into concrete variants, and uses the
# oracle to compute the expected outcome of each variant.
#
# Keys of a template:
#   goal         what the actor wants. The runner gives only this to the actor.
#   axes         decision axes. Each one changes the expected outcome or the
#                checks. The generator makes one variant for each combination.
#   cover        cover axes. They must not change the expected outcome. The
#                generator makes sure that each value occurs with each outcome.
#   exclude      combinations of decision values that make no sense.
#   fixture      the start state, with the parameters in braces.
#   distractors  parts of the start state that look relevant and are not.
#   oracle       rules in order. The first rule that matches gives the outcome.
#   checks       statements about the end state. `outcome` and `when` limit a
#                check to some variants.
#   invariants   IDs from invariants.yaml that a runner checks after each step.
#   verifies     requirement IDs from docs/requirements.md.
#   reference    a scenario in scenarios/ that shows one possible sequence.

# ---------------------------------------------------------------- use case 1

- id: T1.1
  use_case: 1
  name: resolve-and-read
  goal: Get the data of a dataset for a training job, and read it directly from storage.
  axes:
    structure: [records, container, stream, array, opaque]
    storage: [managed, external]
    invalidated: [none, some, all]
  cover:
    members: [10, 10000]
  fixture: >
    A published snapshot with {members} members of the structure {structure}, on storage with the
    management mode {storage}. Invalidated members: {invalidated}. All sources grant train for research.
  oracle:
    - if: {invalidated: all}
      then: {outcome: nothing-to-read}
    - else: {outcome: resolved}
  checks:
    - check: The resolution names the exact version of each input.
    - outcome: resolved
      check: The plan covers each member that is not invalidated, and no other member.
    - outcome: resolved
      check: Each task of the plan has a replica URL, the expected bytes and the expected number of elements.
    - outcome: resolved
      check: The job read all bytes directly from storage.
    - outcome: resolved
      when: {invalidated: some}
      check: The answer gives the number of members that policy excluded.
    - outcome: nothing-to-read
      check: The plan has no task, and mudcat issued no credentials.
    - outcome: nothing-to-read
      check: The answer states that policy excluded all {members} members.
    - when: {structure: [stream, array]}
      check: mudcat made no element list. The plan addresses parts by selector.
    - when: {structure: [records, container]}
      check: The plan addresses elements through an element list.
    - when: {structure: opaque}
      check: The plan addresses each member as one object.
    - when: {storage: external}
      check: mudcat copied no bytes at registration.
  invariants: [INV-1, INV-3, INV-4, INV-15]
  verifies: [ST-1, ST-4, ST-5, RD-1, RD-2, RD-7, UP-3, UP-9]
  reference: UC1-01

- id: T1.2
  use_case: 1
  name: concurrent-commits
  goal: Several writers change the same branch of a dataset at the same time. No change is lost.
  axes:
    change: [add-only, remove, replace]
    members: [disjoint, overlapping]
  cover:
    writers: [2, 8, 32]
  fixture: >
    A dataset whose branch ref main points to a snapshot with 1,000 members. {writers} writers start
    at the same time. Each makes one commit of the kind {change}. The members that they change are {members}.
  oracle:
    - if: {change: add-only}
      then: {outcome: all-succeed-first-time}
    - else: {outcome: conflicts-then-retries}
  checks:
    - check: The change stream has one snapshot-committed event for each successful commit, in commit order.
    - check: The sum of the change summaries is the difference between the first snapshot and the last.
    - outcome: all-succeed-first-time
      check: Each of the {writers} commits succeeds with no retry by the client.
    - outcome: all-succeed-first-time
      check: The last snapshot contains the union of all added members.
    - outcome: all-succeed-first-time
      when: {members: overlapping}
      check: A member that two writers added is in the last snapshot one time.
    - outcome: conflicts-then-retries
      check: Each writer whose requirement names an old snapshot gets a conflict, and no partial change.
    - outcome: conflicts-then-retries
      check: After the retries, the members are the result of the commits applied one after the other, in commit order.
    - outcome: conflicts-then-retries
      when: {members: overlapping}
      check: A writer that removes or replaces a member that is already gone gets an error that names the member.
  invariants: [INV-2, INV-5]
  verifies: [ID-7, EV-1, EV-3, EV-13, PF-5]
  reference: UC1-02

- id: T1.3
  use_case: 1
  name: stage-near-compute
  goal: Have a complete and verified copy of a snapshot on storage near the compute cluster, then resolve it for a job on that cluster.
  axes:
    fault: [none, corrupt-some, mover-stops, agent-stops]
    resolve: [only-at-cluster, any-place]
  cover:
    target: [managed-cache, external-bucket]
    members: [100, 100000]
  fixture: >
    A published snapshot with {members} members, complete on one storage resource far from the
    cluster. A replication rule asks for one copy on a {target} near the cluster. Fault during the
    transfer: {fault}. Then a job on the cluster resolves the snapshot with the place option {resolve}.
  oracle:
    - if: {fault: none}
      then: {outcome: complete}
    - if: {fault: agent-stops}
      then: {outcome: complete-after-lease-ends}
    - if: {resolve: only-at-cluster}
      then: {outcome: not-available-there}
    - else: {outcome: served-from-two-places}
  checks:
    - check: No replica has the state verified without a successful comparison of checksums.
    - check: The completeness record agrees with the states of the replicas.
    - outcome: [complete, complete-after-lease-ends]
      check: The plan uses only replicas on the target.
    - outcome: complete-after-lease-ends
      check: mudcat gave the task of the stopped agent to another agent after the lease ended.
    - outcome: [not-available-there, served-from-two-places]
      check: The completeness record says not complete, and the rule stays not satisfied.
    - outcome: not-available-there
      check: mudcat issues no plan. The answer gives the number of members that are not available near the cluster.
    - outcome: served-from-two-places
      check: The plan uses the far replica for each member that has no verified replica near the cluster.
    - outcome: served-from-two-places
      check: The plan uses no replica with the state suspect or copying.
  invariants: [INV-8]
  verifies: [PL-1, PL-2, RD-4, QY-4]
  reference: UC1-03

# ---------------------------------------------------------------- use case 2

- id: T2.1
  use_case: 2
  name: combine-methods
  goal: Make and publish one training dataset from two datasets.
  axes:
    methods: [same, different]
    equivalence: [none, declared]
    step: [commit, publish]
  fixture: >
    Two published datasets. Their method records are {methods}. Declared equivalence between the
    methods: {equivalence}. The actor does the step {step}.
  oracle:
    - if: {methods: different, equivalence: none, step: publish}
      then: {outcome: refused}
    - if: {methods: different, equivalence: none, step: commit}
      then: {outcome: accepted-with-warning}
    - else: {outcome: accepted}
  checks:
    - outcome: refused
      check: The error names the two methods and the attribute that differs.
    - outcome: refused
      check: The dataset has no new published snapshot.
    - outcome: accepted-with-warning
      check: The snapshot has a warning that names the two methods.
    - outcome: accepted
      when: {methods: different}
      check: The snapshot refers to the declared equivalence, with the person and the reason.
    - outcome: accepted
      when: {methods: same}
      check: The snapshot has no warning.
  invariants: [INV-2]
  verifies: [UP-1, ST-6, ID-3]
  reference: UC2-02

- id: T2.2
  use_case: 2
  name: leakage-check
  goal: Find out if test data is related to the training inputs of a model.
  axes:
    criterion: [exact-checksum, near-duplicate, domain-similarity, time-range-overlap]
    related: [0, 3, 500]
  fixture: >
    A model with recorded training inputs, and an evaluation dataset with 10,000 elements. Under the
    criterion {criterion}, exactly {related} test elements are related to training elements.
  distractors:
    - The training inputs contain 40 pairs of elements that are related to each other under the same criterion.
    - A second evaluation dataset, which the request does not name, has 900 related elements.
  oracle:
    - if: {related: 0}
      then: {outcome: satisfied}
    - else: {outcome: violated}
  checks:
    - check: A leakage assertion exists with the criterion, its version and the evidence.
    - check: A second check with the same inputs gives the same result.
    - check: The assertion counts only relations between the named evaluation dataset and the training inputs.
    - outcome: violated
      check: The assertion gives the number of related test elements, and the number is {related}.
    - when: {criterion: time-range-overlap}
      check: mudcat computed the result from selectors, with no scan of data.
    - when: {criterion: exact-checksum}
      check: mudcat computed the result from recorded checksums, with no scan of data.
  invariants: [INV-4]
  verifies: [QY-3, UP-3, PR-2]
  reference: UC2-03

- id: T2.3
  use_case: 2
  name: reproduce-later
  goal: Get again, one year later, exactly the training inputs of a model.
  axes:
    change: [none, input-has-new-version, member-invalidated, path-renamed, replica-moved, enricher-has-new-version, as-of-expired-snapshot]
  fixture: >
    A model with a resolution from one year ago. Change since then: {change}.
  oracle:
    - if: {change: member-invalidated}
      then: {outcome: same-less-excluded}
    - if: {change: as-of-expired-snapshot}
      then: {outcome: error-states-expiry}
    - else: {outcome: same}
  checks:
    - outcome: same
      check: The members and their versions are the same as one year ago.
    - outcome: same
      when: {change: input-has-new-version}
      check: mudcat also reports that an input has a newer version.
    - outcome: same
      when: {change: path-renamed}
      check: The answer shows the new path, and the same IDs.
    - outcome: same
      when: {change: replica-moved}
      check: The plan has the new replica URL, and the same version IDs and checksums.
    - outcome: same
      when: {change: enricher-has-new-version}
      check: The result has the old version of the annotation set.
    - outcome: same-less-excluded
      check: mudcat reports each element that policy now excludes, and gives the other elements unchanged.
    - outcome: error-states-expiry
      check: The error states that the snapshot expired. mudcat does not resolve to another snapshot.
  invariants: [INV-2, INV-3, INV-4]
  verifies: [UP-3, UP-9, UP-12, UP-13, UP-14, QY-8, ID-2]
  reference: UC2-01

# ---------------------------------------------------------------- use case 3

- id: T3.1
  use_case: 3
  name: policy-gate
  goal: Get data for an action and a purpose. mudcat must permit it only when every source permits it.
  axes:
    action: [train, evaluate]
    purpose: [research, commercial]
    sources: [all-permit, one-lacks-purpose, one-lacks-action, one-expired, one-partly-compiled]
    scope: [whole-dataset, permitted-sources-only]
  fixture: >
    A dataset with members from three sources. Source state: {sources}. With one-lacks-purpose, one
    source grants research only. With one-lacks-action, one source grants evaluate only. The request
    is for the action {action}, the purpose {purpose} and the scope {scope}.
  oracle:
    - if: {scope: permitted-sources-only}
      then: {outcome: permitted}
    - if: {sources: all-permit}
      then: {outcome: permitted}
    - if: {sources: one-lacks-purpose, purpose: commercial}
      then: {outcome: refused}
    - if: {sources: one-lacks-purpose, purpose: research}
      then: {outcome: permitted}
    - if: {sources: one-lacks-action, action: train}
      then: {outcome: refused}
    - if: {sources: one-lacks-action, action: evaluate}
      then: {outcome: permitted}
    - if: {sources: one-expired}
      then: {outcome: refused}
    - if: {sources: one-partly-compiled}
      then: {outcome: blocked-for-review}
  checks:
    - outcome: permitted
      check: The resolution has a policy decision with the policies, the version of the evaluator and the result.
    - outcome: permitted
      check: mudcat issued a plan and credentials.
    - outcome: permitted
      when: {scope: permitted-sources-only}
      check: The plan has no element of a source that does not permit the request, and the answer gives the number of elements that mudcat left out.
    - outcome: refused
      check: The error names the source that does not permit the request, and the number of its elements.
    - outcome: [refused, blocked-for-review]
      check: mudcat issued no plan and no credentials.
    - outcome: [refused, blocked-for-review]
      check: The audit log has the decision.
    - outcome: blocked-for-review
      check: The answer names the clause that needs a review.
  invariants: [INV-9, INV-14]
  verifies: [UP-1, UP-2, UP-3, UP-5, UP-6, UP-15, AC-8]
  reference: UC3-01

- id: T3.2
  use_case: 3
  name: removal
  goal: Remove content at one of five levels, and get the effect of that level and no other.
  axes:
    level: [remove-from-dataset, delete-marker, invalidate, purge, erase]
    hold: [none, active]
    point: [before-any-use, after-resolution, after-training]
    storage: [managed, external-with-versions]
  fixture: >
    Content that is a member of two published snapshots, with replicas on storage of the kind {storage}.
    Legal hold on the content: {hold}. The removal happens {point}. The actor asks for the level {level}.
  distractors:
    - Other content from the same source, which the request does not name, is in the same two snapshots.
    - Training shards with the lifetime class cache derive from the content.
  oracle:
    - if: {level: [remove-from-dataset, delete-marker]}
      then: {outcome: forward-only}
    - if: {level: invalidate}
      then: {outcome: excluded}
    - if: {level: [purge, erase], hold: active}
      then: {outcome: blocked-by-hold}
    - if: {level: purge}
      then: {outcome: bytes-gone}
    - if: {level: erase}
      then: {outcome: record-gone}
  checks:
    - check: The published snapshots keep their members list and their Merkle hash.
    - check: The other content from the same source resolves as before.
    - outcome: forward-only
      check: The newest state does not contain the content. Older snapshots and older versions still resolve.
    - outcome: forward-only
      when: {point: after-training}
      check: The model has no flag.
    - outcome: [forward-only, excluded]
      when: {hold: active}
      check: The hold does not block the request, and the bytes exist.
    - outcome: [excluded, bytes-gone, record-gone, blocked-by-hold]
      check: The content does not resolve from any snapshot, old or new, for a normal user.
    - outcome: [excluded, bytes-gone, record-gone, blocked-by-hold]
      when: {point: [after-resolution, after-training]}
      check: A new run of the old resolution reports the content as excluded.
    - outcome: [excluded, bytes-gone, record-gone, blocked-by-hold]
      when: {point: after-training}
      check: The model has a flag with the number of affected elements. mudcat did not change the model.
    - outcome: [excluded, bytes-gone, record-gone]
      check: The training shards that derive from the content have the same state as the content.
    - outcome: bytes-gone
      check: Each replica has a deletion receipt, and the catalog record of the content stays.
    - outcome: [bytes-gone, record-gone]
      when: {storage: external-with-versions}
      check: The old object versions on the storage are deleted also.
    - outcome: record-gone
      check: Only an erasure record stays, and the state stream has a removal event.
    - outcome: blocked-by-hold
      check: The bytes exist, and the answer names the hold and its reason.
    - outcome: blocked-by-hold
      check: The content is in the retention compartment.
  invariants: [INV-2, INV-3, INV-10, INV-12]
  verifies: [UP-7, UP-8, UP-9, UP-10, UP-11, UP-17, EV-7, QY-8]
  reference: UC3-03

- id: T3.3
  use_case: 3
  name: content-summary
  goal: Make the summary of training content for a model, from the catalog only.
  axes:
    kinds: [crawl-only, crawl-and-licensed, all-four-kinds]
    base_models: [0, 1, 2]
    records: [complete, one-run-has-no-resolution]
  cover:
    sources: [5, 500]
  fixture: >
    A model whose training used {sources} sources of the kinds {kinds}. The model has a chain of
    {base_models} base models, each with its own sources. Records of the training runs: {records}.
  oracle:
    - if: {records: one-run-has-no-resolution}
      then: {outcome: report-states-gap}
    - else: {outcome: report}
  checks:
    - check: The report has one section for each kind of source that the fixture has, and no other section.
    - check: The numbers of elements in the report agree with the numbers in the resolutions.
    - check: mudcat read no training data to make the report.
    - check: For crawled content, the report lists domains by size, crawler names and fetch periods.
    - when: {kinds: [crawl-and-licensed, all-four-kinds]}
      check: For licensed content, the report names each licensor and its terms.
    - when: {base_models: [1, 2]}
      check: The report includes the sources of each of the {base_models} base models in the chain.
    - outcome: report-states-gap
      check: The report names the run that has no resolution, and states that the report is not complete.
    - outcome: report
      check: The report states that it covers all recorded runs.
  invariants: [INV-4]
  verifies: [QY-1, QY-2, UP-1, UP-4]
  reference: UC3-06

# ---------------------------------------------------------------- use case 4

- id: T4.1
  use_case: 4
  name: stream-consumer
  goal: Keep an index outside mudcat equal to the catalog, with the change stream only.
  axes:
    consumer: [current, stops-and-restarts, behind, position-too-old]
    rollbacks: [none, some]
  cover:
    writers: [1, 8, 32]
  fixture: >
    {writers} writers register 10,000 documents in transactions that overlap. Transactions that roll
    back: {rollbacks}. One consumer with the state {consumer}.
  oracle:
    - if: {consumer: position-too-old}
      then: {outcome: must-backfill}
    - else: {outcome: complete-in-order}
  checks:
    - check: The consumer never gets a position lower than a position that it got before.
    - check: At the end, the index of the consumer has exactly the documents of the catalog.
    - when: {rollbacks: some}
      check: The consumer got no event for a transaction that rolled back.
    - when: {consumer: stops-and-restarts}
      check: Events that the consumer gets a second time change nothing, because it uses the revision.
    - when: {consumer: behind}
      check: The consumer gets all events that it did not have, with no backfill.
    - outcome: must-backfill
      check: mudcat tells the consumer that its position is too old.
    - outcome: must-backfill
      check: After a backfill, the live stream continues with no gap.
  invariants: [INV-5, INV-13]
  verifies: [EV-1, EV-3, EV-4, EV-5, EV-13, OP-4, OP-5]
  reference: UC4-04

- id: T4.2
  use_case: 4
  name: retrieval-after-change
  goal: After a change to access or content, the next request shows the new state at once.
  axes:
    change: [remove-from-group, remove-direct-grant, invalidate-document, delete-marker, new-version, restrict-by-tag]
    request: [search-with-current-index, search-with-stale-index, resolve]
  fixture: >
    A user who can read a document through a group and through no other grant, or through one direct
    grant. The change {change} happens. The user then makes the request {request}.
  distractors:
    - A second user has access to the same document through a grant that the change does not affect.
    - A second document with almost the same text is not affected by the change.
  oracle:
    - if: {change: new-version}
      then: {outcome: shows-new-version}
    - else: {outcome: hidden-at-once}
  checks:
    - check: The second document is in the answer as before.
    - outcome: hidden-at-once
      check: The answer to the affected user contains nothing from the affected content.
    - outcome: hidden-at-once
      when: {request: search-with-stale-index}
      check: This is true although the search index has not processed the change.
    - outcome: hidden-at-once
      when: {change: [remove-from-group, remove-direct-grant, restrict-by-tag]}
      check: The second user still gets the document.
    - outcome: hidden-at-once
      when: {change: [remove-from-group, remove-direct-grant]}
      check: mudcat used no cached decision, and the audit log has the denial.
    - outcome: hidden-at-once
      when: {change: invalidate-document}
      check: The second user does not get the document.
    - outcome: hidden-at-once
      when: {change: delete-marker}
      check: An older version still resolves by its version ID for a user with access.
    - outcome: shows-new-version
      check: The answer has the new version, and not the old version.
    - outcome: shows-new-version
      check: A citation of the old version still resolves to the old version.
  invariants: [INV-3, INV-9, INV-11]
  verifies: [AC-1, AC-7, AC-8, EV-11, UP-9]
  reference: UC4-02

# ---------------------------------------------------------------- use case 5

- id: T5.1
  use_case: 5
  name: tenant-isolation
  goal: A user of one tenant tries each interface. The user gets the data of that tenant only.
  axes:
    token: [valid-for-own-tenant, none]
    endpoint: [own, other-tenant]
    target: [own-data, id-of-other-tenant]
  cover:
    interface: [query-by-id, search, change-stream, resolve, lineage, iceberg-gateway, mcp]
  exclude:
    - {token: none, endpoint: other-tenant}
    - {token: none, target: id-of-other-tenant}
  fixture: >
    Two tenants in one instance, with data in each. A user of the first tenant uses the interface
    {interface} at the endpoint {endpoint}, with the token {token}, and asks for {target}.
  distractors:
    - Each tenant has a collection with the same path and an artifact with the same identifier and the same checksum.
  oracle:
    - if: {token: none}
      then: {outcome: refused-no-token}
    - if: {endpoint: other-tenant}
      then: {outcome: refused-wrong-audience}
    - if: {target: id-of-other-tenant}
      then: {outcome: not-found}
    - else: {outcome: own-data-only}
  checks:
    - outcome: own-data-only
      check: Each entity in the answer through {interface} belongs to the tenant of the user.
    - outcome: own-data-only
      check: The answer has the artifact of the own tenant one time, and not the artifact of the other tenant with the same identifier.
    - outcome: not-found
      check: The answer is the same as the answer for an ID that does not exist, with status, body and time.
    - outcome: [refused-no-token, refused-wrong-audience]
      check: mudcat returns no data.
    - outcome: refused-wrong-audience
      check: The refusal is because the audience of the token is not the tenant of the endpoint.
    - outcome: refused-wrong-audience
      when: {target: id-of-other-tenant}
      check: The refusal is the same as the refusal for a request for own data.
  invariants: [INV-6, INV-7]
  verifies: [OP-8, OP-12, OP-13, ID-11, ID-12, EV-6]
  reference: UC5-01

- id: T5.2
  use_case: 5
  name: embargo
  goal: Read a dataset that has an embargo date.
  axes:
    time: [before-end, after-end]
    actor: [group-member, signed-in-outsider, anonymous]
    data: [in-doi-snapshot, not-in-doi-snapshot]
  fixture: >
    A dataset of a group with an embargo date. After that date, the policy lets each signed-in user
    read the dataset. One published snapshot has a DOI and is public. The request is {time} of the
    embargo. The actor is {actor}, and asks for data that is {data}.
  oracle:
    - if: {actor: group-member}
      then: {outcome: readable}
    - if: {data: in-doi-snapshot}
      then: {outcome: readable}
    - if: {time: after-end, actor: signed-in-outsider}
      then: {outcome: readable}
    - else: {outcome: denied}
  checks:
    - outcome: readable
      check: mudcat issues a plan and credentials for the data.
    - outcome: readable
      when: {actor: [signed-in-outsider, anonymous], data: in-doi-snapshot}
      check: The plan covers the members of the DOI snapshot only.
    - outcome: denied
      check: mudcat issues no credentials.
    - outcome: denied
      check: The actor sees of the dataset only what the data policy shows to that actor.
    - when: {time: after-end}
      check: No batch job changed a record at the end of the embargo.
  invariants: [INV-9]
  verifies: [AC-1, ID-8, UP-13]
  reference: UC5-02

- id: T5.3
  use_case: 5
  name: membership-source
  goal: The access of a person follows the membership of a team in an outside service.
  axes:
    event: [member-added, member-removed, provider-down-short, provider-down-long]
    grant: [through-team, direct]
  cover:
    path: [resolve, search]
  fixture: >
    A group with a membership source, which is a team in an outside service. The limit for the age of
    synchronised membership is 24 hours. Event: {event}. Short is 1 hour, long is 25 hours.
    The person has access to a dataset {grant}, and makes a request through {path}.
  oracle:
    - if: {grant: direct}
      then: {outcome: access}
    - if: {event: [member-added, provider-down-short]}
      then: {outcome: access}
    - else: {outcome: denied}
  checks:
    - outcome: access
      check: The request succeeds.
    - outcome: access
      when: {event: provider-down-short, grant: through-team}
      check: The decision record states the age of the membership that mudcat used.
    - outcome: denied
      check: mudcat denies the request, and the audit log has the denial.
    - outcome: denied
      when: {event: provider-down-long}
      check: The denial states that the membership is older than the limit.
    - when: {event: member-removed, grant: direct}
      check: The direct grant still works, and the person is not in the group.
  invariants: [INV-9, INV-11]
  verifies: [AC-1, AC-6, AC-7]
  reference: UC5-04

- id: T5.4
  use_case: 5
  name: tenant-move
  goal: Move a tenant from the shared tier to its own database. Clients see no difference.
  axes:
    fault: [none, fails-at-one-half]
    consumer: [none, at-a-position]
    writes: [none, during-the-move]
  cover:
    versions: [1000, 5000000]
  fixture: >
    A tenant in the shared tier with {versions} versions. A consumer of its change stream:
    {consumer}. Writes by clients of the tenant: {writes}. The operator moves the tenant to a
    dedicated database. Fault: {fault}.
  oracle:
    - if: {fault: none}
      then: {outcome: moved}
    - else: {outcome: stays}
  checks:
    - check: Each record has the same key and the same ID as before.
    - check: Each published snapshot has the same Merkle hash as before.
    - check: The endpoint of the tenant did not change.
    - check: Other tenants in the shared tier see no change.
    - when: {writes: during-the-move}
      check: Each write that mudcat accepted is in the tenant one time. Each write that mudcat did not accept got an error that lets the client try again.
    - outcome: moved
      check: No row of the tenant stays in the shared tier.
    - outcome: moved
      when: {consumer: at-a-position}
      check: The consumer continues from its position with no gap and no event out of order.
    - outcome: stays
      check: The tenant has all its data in the shared tier and accepts writes again.
    - outcome: stays
      check: The dedicated database shows no part of the tenant.
    - outcome: stays
      when: {consumer: at-a-position}
      check: The consumer sees no event of the move that failed.
  invariants: [INV-2, INV-5, INV-6]
  verifies: [OP-7, OP-13, OP-14, ID-12, EV-13]
  reference: UC5-05

# ---------------------------------------------------------------- use case 6

- id: T6.1
  use_case: 6
  name: group-discovered-paths
  goal: See one logical dataset for the files of a pipeline that nobody registered.
  axes:
    pattern: [dated-directories, version-labels, shard-indexes, copies-at-two-sites, no-pattern]
    rules: [rules-set, no-rules]
    checksums: [agree, differ]
  cover:
    files: [60, 600000]
  exclude:
    - {pattern: [dated-directories, version-labels, shard-indexes, no-pattern], checksums: differ}
  fixture: >
    An external storage resource with discovery on holds {files} files that nobody registered. Their
    paths have the pattern {pattern}. Grouping rules of the storage resource: {rules}. The checksums of
    files with the same name at different sites {checksums}.
  oracle:
    - if: {rules: no-rules}
      then: {outcome: one-artifact-for-each-file}
    - if: {pattern: no-pattern}
      then: {outcome: one-artifact-for-each-file}
    - if: {pattern: dated-directories}
      then: {outcome: one-dataset-with-members}
    - if: {pattern: version-labels}
      then: {outcome: one-artifact-with-versions}
    - if: {pattern: shard-indexes}
      then: {outcome: one-artifact-with-parts}
    - if: {pattern: copies-at-two-sites, checksums: agree}
      then: {outcome: one-version-with-replicas}
    - else: {outcome: two-artifacts-with-a-flag}
  checks:
    - check: Each of the {files} files is in the catalog one time.
    - check: A second discovery of the same storage makes no new entry and no event.
    - check: Each artifact records that a site agent discovered it.
    - outcome: one-artifact-for-each-file
      check: The path of each file is an identifier, and a search for a part of the path finds the file.
    - outcome: one-dataset-with-members
      check: The discovered dataset has one member for each date.
    - outcome: one-dataset-with-members
      check: A file of the next day becomes a member of the same dataset, and the dataset keeps its ID.
    - outcome: one-artifact-with-versions
      check: The artifact has one version for each label, in the order of the labels, and latest names the newest.
    - outcome: one-artifact-with-parts
      check: The artifact has one version whose parts are the shards. mudcat reports a shard index that is absent.
    - outcome: one-version-with-replicas
      check: The version has one replica at each site, and each replica has the state verified.
    - outcome: two-artifacts-with-a-flag
      check: mudcat makes two artifacts and no second replica. A flag states that the two files have the same name and different content.
  invariants: [INV-8, INV-19, INV-21]
  verifies: [PL-8, ST-18, OP-5, ID-4]
  reference: UC6-01

- id: T6.2
  use_case: 6
  name: find-unregistered
  goal: Find a dataset that another team made, with no help from that team.
  axes:
    known: [part-of-its-path, name-of-a-field, owner-team, job-that-reads-it]
    described: [by-enrichers-only, by-its-owner]
    access: [reader, no-access]
  fixture: >
    A discovered dataset of another team. A user looks for it and knows only this fact: {known}. The
    metadata of the dataset is {described}. Access of the user to the dataset: {access}.
  distractors:
    - A third team derived a copy of the dataset with fewer fields. The copy matches the same search words.
    - A dataset with the path a/y/x/b exists.
  oracle:
    - if: {access: no-access}
      then: {outcome: hidden}
    - else: {outcome: found}
  checks:
    - outcome: found
      check: The dataset is in the first ten results.
    - outcome: found
      check: The dataset is above the copy that the third team derived from it.
    - outcome: found
      when: {described: by-its-owner}
      check: The dataset is above each result that has no description from a person.
    - outcome: found
      when: {described: by-enrichers-only}
      check: The result shows which values an enricher computed and which values are propagated.
    - outcome: found
      when: {known: part-of-its-path}
      check: A search for x/y finds the path a/x/y/b and does not find the path a/y/x/b.
    - outcome: found
      when: {known: name-of-a-field}
      check: The match comes from the structure of the dataset, which an enricher inferred.
    - outcome: found
      when: {known: owner-team}
      check: A filter on the team gives only datasets of that team.
    - outcome: found
      when: {known: job-that-reads-it}
      check: The match comes from a provenance relation that has the mark inferred.
    - outcome: hidden
      check: The results do not contain the dataset, and no number in the answer includes it.
  invariants: [INV-3, INV-6]
  verifies: [EV-9, EV-10, EV-11, ST-20, PR-12]
  reference: UC6-02

- id: T6.3
  use_case: 6
  name: audit-by-field
  goal: List each dataset that contains a sensitive field, for an audit.
  axes:
    evidence: [declared-structure, inferred-and-certain, inferred-candidate, derived-copy-with-a-new-field-name]
    tag: [propagates, does-not-propagate]
  fixture: >
    One declared dataset has a field with personal data, and a sensitivity tag on it. A second dataset
    contains the same data. The evidence for this in the catalog is {evidence}. The tag {tag} along
    derivation. An auditor asks for each dataset that contains the field.
  distractors:
    - A dataset in a different tenant contains the same field.
    - A dataset has a field with the same name and a different meaning. A person marked it as not sensitive.
  oracle:
    - if: {evidence: [declared-structure, inferred-and-certain]}
      then: {outcome: listed}
    - if: {evidence: inferred-candidate}
      then: {outcome: listed-as-candidate}
    - if: {evidence: derived-copy-with-a-new-field-name, tag: propagates}
      then: {outcome: listed-through-the-tag}
    - else: {outcome: not-listed-and-limit-stated}
  checks:
    - check: The dataset in the different tenant is not in the answer.
    - check: The dataset whose field a person marked as not sensitive is not in the list of findings.
    - outcome: listed
      check: The list has the second dataset, with its owner and its storage resources.
    - outcome: listed
      when: {evidence: inferred-and-certain}
      check: The entry names the enricher and its version.
    - outcome: listed-as-candidate
      check: The entry has the score of the candidate and the mark not confirmed.
    - outcome: listed-through-the-tag
      check: The entry names the derivation that carried the tag.
    - outcome: not-listed-and-limit-stated
      check: The answer states that the tag does not propagate, and that the audit did not examine derived data.
    - when: {tag: propagates, evidence: [declared-structure, inferred-and-certain, inferred-candidate]}
      check: The answer also lists each dataset that derives from the second dataset.
  invariants: [INV-6]
  verifies: [QY-12, ST-14, ST-17, ST-19, OP-8]
  reference: UC6-02

- id: T6.4
  use_case: 6
  name: upstream-problem
  goal: A dataset has wrong values. Find the cause upstream, and find the users downstream.
  axes:
    cause: [upstream-lost-a-field, upstream-size-fell, no-change-upstream]
    path: [direct, through-a-purged-intermediate, through-another-team]
    capture: [observed, inferred-from-logs]
  fixture: >
    A dataset has wrong values from today. State of the dataset upstream: {cause}. The dataset derives
    from the upstream dataset {path}. mudcat got the provenance relations in the mode {capture}. An
    engineer asks for the cause, and for each user downstream of the upstream dataset.
  distractors:
    - The dataset also uses a configuration file that each pipeline of the organisation uses.
  oracle:
    - if: {cause: no-change-upstream}
      then: {outcome: no-cause-upstream}
    - else: {outcome: cause-found}
  checks:
    - check: The configuration file is not in the answer.
    - outcome: cause-found
      check: The answer names the upstream snapshot that changed, and the change.
    - outcome: cause-found
      check: The answer lists each dataset and each model downstream of that snapshot, with the owner of each.
    - outcome: cause-found
      when: {path: through-a-purged-intermediate}
      check: The path in the answer contains the stub of the intermediate, with the time of its purge.
    - outcome: cause-found
      when: {path: through-another-team}
      check: The answer names the owner team of each step of the path.
    - when: {capture: inferred-from-logs}
      check: Each relation in the answer has the mark inferred.
    - outcome: no-cause-upstream
      check: The answer states that no upstream snapshot changed in the period, and names the snapshots that it compared.
  invariants: [INV-17]
  verifies: [PR-3, PR-8, PR-12, QY-11]
  reference: UC6-03

- id: T6.5
  use_case: 6
  name: watch-a-dataset
  goal: Get an alert when a dataset changes in a way that nobody expected.
  axes:
    change: [none, grows-as-before, size-falls-by-90-percent, a-field-is-absent, empty-values-appear]
    severity: [warn, block]
    step: [commit, publish]
  fixture: >
    A dataset has 30 daily snapshots. Each one is about 10% larger than the one before. The owner set
    expectations for the size, the fields and the empty values, with the severity {severity}. The next
    snapshot has this change: {change}. The pipeline does the step {step}.
  oracle:
    - if: {change: [none, grows-as-before]}
      then: {outcome: passed}
    - if: {severity: block, step: publish}
      then: {outcome: publication-refused}
    - else: {outcome: alert-sent}
  checks:
    - check: mudcat tested the expectations from statistics, with no read of data.
    - check: The snapshot has one result for each expectation.
    - outcome: passed
      check: The change stream has no event for a failure.
    - outcome: passed
      when: {change: grows-as-before}
      check: mudcat does not report the larger size as a failure.
    - outcome: alert-sent
      check: The change stream has one event for the failure, with the expectation, the expected range and the value.
    - outcome: alert-sent
      when: {step: commit}
      check: The commit succeeds.
    - outcome: alert-sent
      when: {step: publish}
      check: The snapshot is published, and its record has the failure.
    - outcome: publication-refused
      check: The error names the expectation. The snapshot is not published, and the tag ref of the last publication does not move.
    - outcome: publication-refused
      check: The change stream has one event for the failure.
  invariants: [INV-2, INV-5, INV-20]
  verifies: [ST-22, ST-23, EV-15, EV-1]
  reference: UC6-03

- id: T6.6
  use_case: 6
  name: discovered-data
  goal: Find and use data that a group put on its own storage and did not register.
  axes:
    origin: [declared, discovered, discovered-then-claimed]
    request: [search, read, train]
  cover:
    files: [20, 200000]
  fixture: >
    An external storage resource of a group, with discovery on, holds {files} files under one prefix.
    Their state in the catalog is {origin}. With discovered-then-claimed, an owner assigned a source
    that grants train for research. A member of the group makes the request {request} for research.
  distractors:
    - A second prefix on the same storage resource has discovery off.
  oracle:
    - if: {origin: discovered, request: train}
      then: {outcome: refused-unknown-source}
    - if: {request: search}
      then: {outcome: found}
    - else: {outcome: resolved}
  checks:
    - check: No file under the second prefix has an entry in the catalog.
    - check: Each of the {files} files has one artifact, or is a part of one artifact, and no file has two.
    - when: {origin: [discovered, discovered-then-claimed]}
      check: Each artifact records that a site agent discovered it.
    - when: {origin: discovered}
      check: Each metadata value has an enricher as its assertion origin, and no value has a person as its origin.
    - outcome: found
      when: {origin: discovered}
      check: The result shows which values an enricher computed for the entry, and which values are propagated.
    - outcome: resolved
      check: mudcat issues a plan, and the resolution names exact versions.
    - outcome: refused-unknown-source
      check: The error states that the source is unknown, and gives the number of versions with no source.
    - outcome: refused-unknown-source
      check: mudcat issues no plan and no credentials, and the audit log has the decision.
  invariants: [INV-4, INV-9, INV-14, INV-19, INV-21]
  verifies: [ST-18, ST-20, UP-16, PL-8, OP-5]
  reference: UC6-01

# ---------------------------------------------------------------- use case 7

- id: T7.1
  use_case: 7
  name: run-view
  goal: Get, for one model, exactly the data, the checks and the code that made it.
  axes:
    history: [one-run, many-runs-with-shared-inputs, chain-of-warm-starts]
    model: [in-service, never-deployed]
  cover:
    capture: [run-tokens, the-client-sdk, import-of-openlineage-events]
  fixture: >
    A pipeline with the history {history}. With many runs, 500 runs each used the last 7 daily spans.
    With the chain, each model started from the model before. The provenance came through {capture}. A
    person asks for the run view of the newest model, which is {model}.
  oracle:
    - if: {history: chain-of-warm-starts}
      then: {outcome: view-with-a-border}
    - else: {outcome: view}
  checks:
    - check: The view contains the training activity, its 7 input spans, the validation activities on those spans, the evaluation and the code version.
    - check: The view contains no activity of a different run.
    - when: {history: many-runs-with-shared-inputs}
      check: The number of nodes in the view is the same as for a pipeline with one run.
    - outcome: view-with-a-border
      check: The model before is in the view as a border. The view does not contain the inputs of that model.
    - outcome: view-with-a-border
      check: The answer states that a request with the base-model role gives the chain.
    - when: {model: in-service}
      check: The view contains the deployment, with the service and the time.
    - when: {model: never-deployed}
      check: The view contains no deployment, and the use record of the model shows no onward use.
  invariants: [INV-4]
  verifies: [PR-3, PR-4, PR-9, PR-10, PR-11]
  reference: UC7-01

- id: T7.2
  use_case: 7
  name: rolling-window
  goal: Train each day on the last days of data, with no copy of the data.
  axes:
    since_yesterday: [nothing-new, a-new-span, an-old-span-corrected, an-old-span-invalidated]
    request: [the-newest-window, the-window-of-yesterday]
  fixture: >
    A dataset with one span for each day. A job trains each day on the last 7 spans. Change after the
    run of yesterday: {since_yesterday}. The job of today asks for {request}.
  oracle:
    - if: {since_yesterday: an-old-span-invalidated}
      then: {outcome: inputs-less-excluded}
    - if: {request: the-window-of-yesterday}
      then: {outcome: same-inputs}
    - if: {since_yesterday: nothing-new}
      then: {outcome: same-inputs}
    - if: {since_yesterday: a-new-span}
      then: {outcome: window-moved}
    - else: {outcome: window-with-a-new-version}
  checks:
    - check: No input has a new replica. The job made no copy of its input.
    - check: The resolution of yesterday names the same versions as before.
    - outcome: same-inputs
      check: The inputs are the same as the inputs of yesterday, version for version.
    - outcome: same-inputs
      when: {since_yesterday: an-old-span-corrected}
      check: mudcat also reports that one input has a newer version.
    - outcome: window-moved
      check: Six spans are the same as yesterday. The new snapshot refers again to the manifests of those six spans.
    - outcome: window-moved
      check: mudcat gives the similarity between the input of today and the input of yesterday from statistics, with no read of data.
    - outcome: window-with-a-new-version
      check: The corrected span is in the window with its new version, and the answer names the change.
    - outcome: inputs-less-excluded
      check: The invalidated span is not in the plan, and the answer gives the number of elements that policy excluded.
  invariants: [INV-1, INV-2, INV-3, INV-4]
  verifies: [UP-3, UP-9, ID-13, QY-8]
  reference: UC7-01

- id: T7.3
  use_case: 7
  name: validation-gate
  goal: Stop a run before training when its input fails a check.
  axes:
    data: [as-expected, values-drifted, a-field-is-absent, the-span-is-empty]
    option: [any-snapshot, only-snapshots-that-passed]
  fixture: >
    The newest span of the input of a pipeline is {data}. The dataset has expectations for the
    distribution of values, the fields and the number of members. The training job resolves the newest
    snapshot with the option {option}.
  oracle:
    - if: {data: as-expected}
      then: {outcome: resolved}
    - if: {option: only-snapshots-that-passed}
      then: {outcome: refused-before-a-read}
    - else: {outcome: resolved-with-failures-stated}
  checks:
    - check: mudcat tested the expectations from statistics, with no read of data.
    - outcome: resolved
      check: The resolution records that each expectation passed.
    - outcome: refused-before-a-read
      check: mudcat issues no plan and no credentials. The error names the expectation and the snapshot.
    - outcome: refused-before-a-read
      check: The answer names the newest snapshot that passed.
    - outcome: resolved-with-failures-stated
      check: The resolution records each failure, and the run view of the model shows it later.
    - when: {data: the-span-is-empty}
      check: The result for the number of members is a failure, and the result for the fields is not.
  invariants: [INV-4, INV-20]
  verifies: [ST-22, EV-15, RD-10, UP-3]
  reference: UC7-02

- id: T7.4
  use_case: 7
  name: end-of-lifetime
  goal: Keep storage small. Remove the bytes of intermediates and caches of a curation pipeline, and lose no lineage.
  axes:
    class: [intermediate, cache]
    event: [lifetime-ends, input-invalidated]
    lock: [none, replication-rule]
  cover:
    runs: [1, 500]
  fixture: >
    A pipeline made {runs} runs. Each run made a durable output from a durable input, through an
    artifact of the lifetime class {class}. Lock on that artifact: {lock}. Then the event {event} occurs.
  distractors:
    - A durable artifact in the same collection has the same age and no lock.
  oracle:
    - if: {event: input-invalidated}
      then: {outcome: invalidated-with-input}
    - if: {lock: replication-rule}
      then: {outcome: kept}
    - else: {outcome: bytes-purged-stub-kept}
  checks:
    - check: The durable artifact in the same collection has its bytes and resolves as before.
    - check: A lineage query from the durable output returns the durable input, through the artifact of the class {class}.
    - outcome: bytes-purged-stub-kept
      check: Each replica of the artifact has a deletion receipt.
    - outcome: bytes-purged-stub-kept
      check: The catalog record has the ID, the content checksum, the size and the statistics of the artifact.
    - outcome: bytes-purged-stub-kept
      check: A resolution of the artifact fails with an error that states that the lifetime ended.
    - outcome: bytes-purged-stub-kept
      when: {class: cache}
      check: A new request for the same representation makes it again, and the new copy has the same content checksum.
    - outcome: bytes-purged-stub-kept
      when: {class: intermediate}
      check: mudcat does not run the pipeline again to make the artifact.
    - outcome: kept
      check: The bytes exist, and the answer to a purge request names the replication rule.
    - outcome: invalidated-with-input
      check: The artifact does not resolve for a normal user, and its invalidation record names the input.
    - outcome: invalidated-with-input
      when: {lock: replication-rule}
      check: The replication rule does not stop the invalidation.
    - outcome: invalidated-with-input
      check: The durable output has a flag with the number of affected elements.
  invariants: [INV-3, INV-10, INV-17]
  verifies: [PR-8, PL-7, UP-17, UP-9]
  reference: UC7-03

- id: T7.5
  use_case: 7
  name: never-deployed
  goal: Find the runs and the data that led to nothing, and remove what can go.
  axes:
    use: [deployed, start-point-of-a-deployed-model, evaluated-in-its-own-run-only, no-use]
    age: [inside-the-period, past-the-period]
    protection: [none, legal-hold]
    kind: [cache, durable]
  fixture: >
    A training set of the lifetime class {kind}, and the model that one run trained on it. Use of the
    model: {use}. The last use was {age} that the tenant set for abandoned data. Protection of the
    training set: {protection}. A retention rule for abandoned data is active. An operator asks for the
    abandoned data.
  oracle:
    - if: {use: [deployed, start-point-of-a-deployed-model]}
      then: {outcome: in-use}
    - if: {protection: legal-hold}
      then: {outcome: protected}
    - if: {age: inside-the-period}
      then: {outcome: not-yet}
    - else: {outcome: abandoned}
  checks:
    - outcome: in-use
      check: The training set is not in the list. Its use record names the deployment that the chain of uses reaches.
    - outcome: in-use
      when: {use: start-point-of-a-deployed-model}
      check: The chain goes through the later model.
    - outcome: protected
      check: The training set is not in the list of abandoned data. The bytes exist, and the answer names the hold.
    - outcome: not-yet
      check: The training set is not in the list.
    - outcome: abandoned
      check: The training set is in the list, with its size, its storage resources, its sources and the duties that apply.
    - outcome: abandoned
      when: {use: evaluated-in-its-own-run-only}
      check: The evaluation in the same run does not count as onward use.
    - outcome: abandoned
      when: {kind: cache}
      check: The retention rule purged the bytes. The stub and one deletion receipt for each replica exist.
    - outcome: abandoned
      when: {kind: durable}
      check: The bytes exist. The list asks for the decision of a person.
  invariants: [INV-10, INV-12, INV-17]
  verifies: [QY-9, QY-10, PR-9, PL-7, UP-8]
  reference: UC7-03

- id: T7.6
  use_case: 7
  name: bad-input
  goal: An input was bad. Find each run, model and deployment that used it.
  axes:
    found: [before-any-use, after-training, after-deployment]
    path: [direct, through-a-purged-intermediate, through-a-warm-start]
    action: [report-only, invalidate]
  exclude:
    - {found: before-any-use, path: [through-a-purged-intermediate, through-a-warm-start]}
  fixture: >
    One daily span of input has bad values. A person finds this {found}. The models that used the span
    used it {path}. The person asks for each run, model and deployment that used the span, and then does
    this action: {action}.
  oracle:
    - if: {found: before-any-use}
      then: {outcome: nothing-affected}
    - if: {path: through-a-warm-start}
      then: {outcome: listed-when-the-role-is-included}
    - if: {found: after-training}
      then: {outcome: models-listed}
    - else: {outcome: deployments-listed}
  checks:
    - outcome: nothing-affected
      check: The list is empty.
    - outcome: nothing-affected
      when: {action: invalidate}
      check: The next resolution of the window does not contain the span.
    - outcome: models-listed
      check: The list has each run and each model, with the number of elements from the span, and no deployment.
    - outcome: deployments-listed
      check: The list also has each deployment, with its service and its owner.
    - outcome: [models-listed, deployments-listed]
      when: {path: through-a-purged-intermediate}
      check: The list is complete, although the intermediate has no bytes.
    - outcome: listed-when-the-role-is-included
      check: The default answer lists the first model only, and states that it did not follow the base-model role.
    - outcome: listed-when-the-role-is-included
      check: A request that includes the base-model role lists each later model.
    - outcome: [models-listed, deployments-listed, listed-when-the-role-is-included]
      when: {action: invalidate}
      check: Each listed model has a flag with the number of affected elements. mudcat changed no model and no deployment.
    - outcome: [models-listed, deployments-listed, listed-when-the-role-is-included]
      when: {action: report-only}
      check: No model has a flag, and the span resolves as before.
  invariants: [INV-3, INV-17]
  verifies: [QY-11, PR-3, PR-8, UP-9]
  reference: UC7-02

# ---------------------------------------------------------------- use case 8

- id: T8.1
  use_case: 8
  name: publish-a-description
  goal: Make a dataset public, so that a dataset search engine can find it.
  axes:
    name: [present, absent]
    text: [absent, of-20-characters, of-300-characters]
    licence: [stated, absent]
    audience: [public, the-tenant-only]
  fixture: >
    A snapshot with a creator, a landing page and a date. In the describe namespace, the name is {name},
    the description text is {text} and the licence is {licence}. The owner publishes the snapshot for
    the audience {audience}.
  oracle:
    - if: {audience: the-tenant-only}
      then: {outcome: published-with-a-report}
    - if: {name: absent}
      then: {outcome: refused}
    - if: {text: [absent, of-20-characters]}
      then: {outcome: refused}
    - if: {licence: absent}
      then: {outcome: public-at-the-level-search}
    - else: {outcome: public-at-the-level-croissant}
  checks:
    - outcome: published-with-a-report
      check: The snapshot is published in the tenant. The report lists the properties that it lacks for each level.
    - outcome: published-with-a-report
      check: mudcat serves no public landing page for the snapshot.
    - outcome: refused
      check: The error names each property that is absent or too short. The snapshot is not public.
    - outcome: [public-at-the-level-search, public-at-the-level-croissant]
      check: The landing page has a JSON-LD description with the name, the description, the address, the version, the identifier and one distribution with an address and a format.
    - outcome: [public-at-the-level-search, public-at-the-level-croissant]
      check: The sitemap has the landing page.
    - outcome: [public-at-the-level-search, public-at-the-level-croissant]
      check: The description contains nothing that an anonymous reader cannot see.
    - outcome: public-at-the-level-search
      check: The report states that the licence is absent, and mudcat serves no Croissant file.
    - outcome: public-at-the-level-croissant
      check: The Croissant file states the version of the specification, and has each file with its checksum and the record sets of the structure.
  invariants: [INV-18]
  verifies: [IN-4, IN-8, IN-9, IN-10, IN-11, IN-13]
  reference: UC8-01

- id: T8.2
  use_case: 8
  name: correct-and-cite
  goal: Publish a correction, and keep each citation of the old version correct.
  axes:
    change: [a-new-snapshot, a-corrected-text, withdrawal-of-the-old-snapshot, invalidation-of-a-member]
    citation: [the-doi-of-the-old-snapshot, the-landing-page-of-the-dataset]
  fixture: >
    A public dataset with one published snapshot that has a DOI. A paper cites the data by {citation}.
    Then this change occurs: {change}. A reader follows the citation.
  oracle:
    - if: {change: a-new-snapshot, citation: the-doi-of-the-old-snapshot}
      then: {outcome: old-snapshot-shown}
    - if: {change: a-new-snapshot}
      then: {outcome: newest-shown-with-a-link-to-the-old}
    - if: {change: a-corrected-text, citation: the-doi-of-the-old-snapshot}
      then: {outcome: old-text-kept}
    - if: {change: a-corrected-text}
      then: {outcome: new-text-shown}
    - if: {change: withdrawal-of-the-old-snapshot}
      then: {outcome: withdrawal-shown}
    - else: {outcome: shown-with-an-exclusion}
  checks:
    - check: The Merkle hash of the old snapshot is the same as before the change.
    - outcome: old-snapshot-shown
      check: The DOI leads to the description of the old snapshot. That description names the newer version.
    - outcome: newest-shown-with-a-link-to-the-old
      check: The page shows the new snapshot, with its version and a link to the version before.
    - outcome: old-text-kept
      check: The description of the published snapshot is the same as before.
    - outcome: new-text-shown
      check: The page shows the corrected text and a new date of modification. The description of the published snapshot is the same as before.
    - outcome: withdrawal-shown
      check: The page exists. It states the withdrawal, its date and its reason, and it has no distribution.
    - outcome: shown-with-an-exclusion
      check: The description states that mudcat excludes some members. A resolution of the snapshot does not contain the invalidated member.
  invariants: [INV-2, INV-3]
  verifies: [ID-2, ID-3, ID-8, IN-8, UP-9, UP-10]
  reference: UC8-01

- id: T8.3
  use_case: 8
  name: copy-or-based-on
  goal: State correctly how a dataset relates to the dataset that it came from.
  axes:
    relation: [the-same-content, a-subset, changed-values, a-combination-of-two, no-relation]
    origin: [own-dataset, imported-public-dataset]
    statement: [none, the-owner-says-it-is-a-copy]
  fixture: >
    A new dataset. Its real relation to an earlier dataset is {relation}. The earlier dataset is an
    {origin}. Statement of the owner about the relation: {statement}. The owner publishes the new
    dataset.
  oracle:
    - if: {relation: the-same-content}
      then: {outcome: same-as}
    - if: {statement: the-owner-says-it-is-a-copy}
      then: {outcome: statement-refused}
    - if: {relation: no-relation}
      then: {outcome: neither}
    - else: {outcome: based-on}
  checks:
    - outcome: same-as
      check: The description has sameAs with the address of the earlier dataset, and no isBasedOn.
    - outcome: same-as
      check: mudcat set sameAs because the two Merkle hashes are equal.
    - outcome: statement-refused
      check: mudcat refuses the statement because the content hashes differ, and the error gives the two hashes.
    - outcome: neither
      check: The description has no sameAs and no isBasedOn.
    - outcome: based-on
      check: The description has isBasedOn with the earlier dataset, and the provenance has the derivation with its activity.
    - outcome: based-on
      when: {relation: a-combination-of-two}
      check: isBasedOn names the two datasets.
    - outcome: [same-as, based-on]
      when: {origin: imported-public-dataset}
      check: The description names the original by its canonical address. Its terms are not broader than the terms of the original.
  invariants: [INV-2, INV-14]
  verifies: [IN-8, ID-5, PR-1, UP-2]
  reference: UC8-02

- id: T8.4
  use_case: 8
  name: import-and-train
  goal: Use a public dataset in training together with own data, under its licence.
  axes:
    licence: [permits-each-use, research-only, not-stated, a-text-with-a-new-clause]
    purpose: [research, commercial]
    files: [reachable, not-reachable]
  cover:
    format: [schema-org, dcat, croissant]
  fixture: >
    A public dataset in another repository, with a description in the format {format}. Its licence:
    {licence}. Its files are {files} from the cluster of the team. The team imports the description.
    Then it resolves the dataset together with its own data, for training with the purpose {purpose}.
  oracle:
    - if: {licence: not-stated}
      then: {outcome: refused-unknown-terms}
    - if: {licence: a-text-with-a-new-clause}
      then: {outcome: blocked-for-review}
    - if: {licence: research-only, purpose: commercial}
      then: {outcome: refused}
    - if: {files: not-reachable}
      then: {outcome: permitted-and-not-available}
    - else: {outcome: permitted}
  checks:
    - check: The import copied no bytes. The dataset is on a reference storage resource.
    - check: Each payload of the dataset has the assertion origin imported, and its source is an external source with the terms as received.
    - check: A second import of the same description makes no new entry.
    - outcome: permitted
      check: The plan covers the own data and the public data, and one policy decision names the sources of both.
    - outcome: permitted
      check: Where the description gives a checksum, the first read compares it with the bytes.
    - outcome: permitted-and-not-available
      check: The policy decision permits the request. mudcat issues no plan for the public members, and states that the cluster can reach no replica of them.
    - outcome: refused
      check: The error names the external source and the purpose.
    - outcome: refused-unknown-terms
      check: The error states that the description gives no licence.
    - outcome: blocked-for-review
      check: The answer names the clause that needs a review.
    - outcome: [refused, refused-unknown-terms, blocked-for-review]
      check: mudcat issues no plan and no credentials, for the own data also.
  invariants: [INV-9, INV-14]
  verifies: [IN-12, UP-1, UP-2, UP-5, UP-6, OP-5]
  reference: UC8-03

- id: T8.5
  use_case: 8
  name: the-original-changes
  goal: Know when a public dataset changed or went away after the team used it.
  axes:
    original: [no-change, a-new-version, a-changed-description, withdrawn, changed-content-with-no-new-version]
    use: [not-used, used-by-a-trained-model]
  fixture: >
    An imported public dataset. State of the original at the next import: {original}. Use of the dataset
    in the tenant before that import: {use}.
  oracle:
    - if: {original: no-change}
      then: {outcome: nothing-new}
    - if: {original: a-new-version}
      then: {outcome: new-snapshot}
    - if: {original: a-changed-description}
      then: {outcome: description-updated}
    - if: {original: withdrawn}
      then: {outcome: marked-as-withdrawn}
    - else: {outcome: flagged-as-changed}
  checks:
    - outcome: nothing-new
      check: The import makes no new entry and no event.
    - outcome: new-snapshot
      check: The dataset has a new snapshot that names the snapshot before. The old snapshot resolves as before.
    - outcome: description-updated
      check: The dataset has the new values. The history has the values that mudcat imported before.
    - outcome: marked-as-withdrawn
      check: The dataset records that its origin withdrew it, and the change stream has an event. mudcat invalidates nothing.
    - outcome: flagged-as-changed
      check: mudcat keeps the old checksums and makes new versions for the files that changed. The event names those files.
    - when: {use: used-by-a-trained-model}
      check: The resolution of the model names the same versions as before.
    - outcome: new-snapshot
      when: {use: used-by-a-trained-model}
      check: mudcat reports that an input of the model has a newer version.
    - outcome: [marked-as-withdrawn, flagged-as-changed]
      when: {use: used-by-a-trained-model}
      check: The model has a notice, and a person decides what to do.
  invariants: [INV-2, INV-4]
  verifies: [IN-12, ID-3, ID-4, EV-1, OP-5]
  reference: UC8-03
