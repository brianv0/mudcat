# Invariants: statements that are true after every step of every eval.
# A runner checks each invariant after each action, in every task variant
# and in every random sequence of actions.

- id: INV-1
  statement: mudcat transfers no data bytes when a client reads data.
  observe: The network record of the read shows connections from the client to storage only.
  verifies: [RD-1]

- id: INV-2
  statement: A published snapshot never changes its members or its Merkle hash.
  observe: Compare the members and the hash of each published snapshot with their values at publication.
  verifies: [ID-3, ID-5, UP-10, OP-6]

- id: INV-3
  statement: Invalidated content is never in a resolution, a plan or a search result.
  observe: For each resolution, plan and result list made after an invalidation, look for the invalidated IDs and fingerprints.
  verifies: [UP-9, EV-11]

- id: INV-4
  statement: A resolution names the exact version or snapshot of each input.
  observe: No input of a resolution is a ref, a path or the word latest.
  verifies: [UP-3]

- id: INV-5
  statement: The change stream has exactly one event for each committed change, no event for a change that did not commit, and positions in commit order.
  observe: Compare the stream of a consumer with the list of commits. Look for a position lower than an earlier one.
  verifies: [EV-1, EV-3, EV-13]

- id: INV-6
  statement: A request returns only the data of its own tenant, unless an explicit grant between tenants applies.
  observe: Each ID in each answer belongs to the tenant of the request or to a recorded grant between tenants.
  verifies: [OP-8, ID-12]

- id: INV-7
  statement: The answer for an ID of another tenant is the same as the answer for an ID that does not exist.
  observe: Compare the two answers, with status, body and time.
  verifies: [OP-8]

- id: INV-8
  statement: A replica has the state verified only after a successful comparison of checksums.
  observe: Each replica with the state verified has a verification record with a checksum that agrees with the version.
  verifies: [ID-4, PL-1]

- id: INV-9
  statement: Each access decision at an enforcement point is in the audit log.
  observe: Count the decisions at registration, resolution, materialisation, export and deletion, and compare with the audit log.
  verifies: [AC-8]

- id: INV-10
  statement: mudcat removes no version and no manifest that a reference in any tenant names.
  observe: After each removal, look for references with no target.
  verifies: [OP-15]

- id: INV-11
  statement: After a grant is removed, each check that starts later is denied the access that the grant gave.
  observe: Make the same request directly after each revocation.
  verifies: [AC-7]

- id: INV-12
  statement: mudcat does not purge or erase content that a legal hold covers.
  observe: The bytes and the records of held content exist after each purge and erase request.
  verifies: [UP-8]

- id: INV-13
  statement: A second registration of the same artifact with the same checksum makes no new version and no new event.
  observe: Register each artifact two times, and count versions and events.
  verifies: [OP-5]

- id: INV-14
  statement: A permitted resolution contains no element whose source does not grant the action and the purpose of the request.
  observe: For each element of each permitted resolution, look up the grants of its source at the time of the decision.
  verifies: [UP-2, UP-15]

- id: INV-15
  statement: Credentials with the scope of a prefix cover no object outside one ACL root that the caller can read.
  observe: List the objects under the prefix of each credential, and check the access of the caller to each.
  verifies: [RD-3]

- id: INV-16
  statement: A derived index that is dropped and built again has the same content as before.
  observe: Compare the documents of the index before the drop and after the rebuild.
  verifies: [OP-2]

- id: INV-17
  statement: The provenance relations of a version exist after mudcat purges the bytes of the version.
  observe: After each purge, run a lineage query from an output that derives from the purged version, and compare the result with the result before the purge.
  verifies: [PR-8]

- id: INV-18
  statement: A public description contains nothing that an anonymous reader cannot see.
  observe: Compare each property of each public description with the answer that the catalog gives to a request with no token.
  verifies: [IN-13]

- id: INV-19
  statement: A second discovery of the same object makes no new entry and no new event.
  observe: Run each discovery two times, and count entries and events.
  verifies: [PL-8, OP-5]

- id: INV-20
  statement: mudcat reads no data bytes when it tests an expectation.
  observe: The record of storage access shows no read between a commit and its expectation results.
  verifies: [ST-22]

- id: INV-21
  statement: No metadata value of a discovered entry has a person as its assertion origin, unless a person wrote that value.
  observe: For each discovered entry, compare the assertion origin of each value with the log of writes by persons.
  verifies: [ST-7, ST-18]

- id: INV-22
  statement: A ranked search answer contains no entity that the complete answer to the same request does not contain.
  observe: Send each search two times, one time for a ranked answer and one time for a complete answer, and compare the entities.
  verifies: [EV-11, EV-21]

- id: INV-23
  statement: No count in a search answer includes an entity that the caller cannot read.
  observe: Compare each total and each facet count with the number of matches that the caller can read.
  verifies: [EV-19]

- id: INV-24
  statement: A reader sees all entries of a registration commit or none of them.
  observe: A reader lists the collection and the dataset again and again while commits run. Each answer has all entries of each commit that it shows.
  verifies: [OP-16, OP-21]

- id: INV-25
  statement: Two reads as of the same commit give the same entries, except for content that policy removed in between.
  observe: Repeat each read with its commit ID after later commits, and compare the answers.
  verifies: [ID-22, UP-12]
