[package]
name = "mudcat"
version = "0.1.0"
edition = "2021"
description = "mudcat: a multimodal data catalog (reference implementation)"
license = "Apache-2.0"
default-run = "mudcat"

[dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-serde_json-1", "with-chrono-0_4"] }
deadpool-postgres = "0.14"
futures = "0.3"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
clap = { version = "4", features = ["derive", "env"] }
bytes = "1"
parking_lot = "0.12"

[features]
# seeded defects for the mutation gate; see scripts/mutation-gate.sh
mutants = []

[profile.release]
debug = 1

[profile.dev.package."*"]
opt-level = 2
